<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Claw - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header .status {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #4ade80;
        }

        .status-dot.disconnected {
            background: #f87171;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message.system .message-content {
            background: #fef3c7;
            color: #92400e;
            max-width: 100%;
            text-align: center;
            font-size: 14px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .settings {
            padding: 10px 20px;
            background: #f1f5f9;
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 14px;
            color: #64748b;
        }

        .settings label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            width: 120px;
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Mini Claw</h1>
            <div class="status">
                <span class="status-dot disconnected" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <div class="settings">
            <label>
                用户ID:
                <input type="text" id="userId" value="user01" placeholder="用户ID">
            </label>
            <label>
                会话ID:
                <input type="text" id="sessionId" placeholder="自动生成">
            </label>
            <button onclick="generateSessionId()" style="padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer;">新建会话</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message system">
                <div class="message-content">欢迎使用 Mini Claw AI 助手！请输入您的问题。</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button id="sendButton" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let eventSource = null;
        let currentSessionId = null;

        // 生成UUID
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // 生成新会话ID
        function generateSessionId() {
            const sessionId = generateUUID();
            document.getElementById('sessionId').value = sessionId;
            currentSessionId = sessionId;
            clearChat();
            addSystemMessage('新会话已创建: ' + sessionId.substring(0, 8) + '...');
        }

        // 清空聊天
        function clearChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
        }

        // 添加系统消息
        function addSystemMessage(text) {
            addMessage('system', text);
        }

        // 添加消息到聊天区
        function addMessage(role, content) {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 添加正在输入指示器
        function addTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingIndicator';
            messageDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 移除正在输入指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 更新连接状态
        function updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = '已连接';
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = '未连接';
            }
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const userId = document.getElementById('userId').value || 'anonymous';
            const sessionId = document.getElementById('sessionId').value || generateUUID();

            const message = input.value.trim();
            if (!message) return;

            // 更新会话ID
            currentSessionId = sessionId;
            document.getElementById('sessionId').value = sessionId;

            // 显示用户消息
            addMessage('user', message);
            input.value = '';
            sendButton.disabled = true;

            // 显示正在输入
            addTypingIndicator();

            try {
                // 先建立 SSE 连接，等待连接就绪后再发送消息
                await ensureSSEConnection(sessionId);

                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        sessionId: sessionId,
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    removeTypingIndicator();
                    addSystemMessage('错误: ' + (data.error || '发送失败'));
                }
            } catch (error) {
                removeTypingIndicator();
                addSystemMessage('网络错误: ' + error.message);
            } finally {
                sendButton.disabled = false;
            }
        }

        // 确保 SSE 连接已建立
        function ensureSSEConnection(sessionId) {
            return new Promise((resolve, reject) => {
                // 如果已有连接且 sessionId 相同，直接返回
                if (eventSource && currentSessionId === sessionId && eventSource.readyState === EventSource.OPEN) {
                    resolve();
                    return;
                }

                // 关闭旧连接
                if (eventSource) {
                    eventSource.close();
                }

                eventSource = new EventSource(`${API_BASE}/sse/${sessionId}`);

                // 监听 ready 事件，表示服务端已准备好
                eventSource.addEventListener('ready', function(event) {
                    updateConnectionStatus(true);
                    resolve();
                });

                eventSource.onmessage = function(event) {
                    removeTypingIndicator();
                    try {
                        const data = JSON.parse(event.data);
                        if (data.content) {
                            addMessage('assistant', data.content);
                        }
                    } catch (e) {
                        // 非JSON数据，直接显示
                        if (event.data && event.data !== 'ping') {
                            addMessage('assistant', event.data);
                        }
                    }
                };

                eventSource.onerror = function(error) {
                    updateConnectionStatus(false);
                    if (eventSource.readyState === EventSource.CLOSED) {
                        reject(new Error('SSE 连接失败'));
                    }
                };

                // 设置超时
                setTimeout(() => {
                    if (eventSource.readyState !== EventSource.OPEN) {
                        reject(new Error('SSE 连接超时'));
                    }
                }, 5000);
            });
        }

        // 启动SSE连接
        function startSSE(sessionId) {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${API_BASE}/sse/${sessionId}`);

            eventSource.onopen = function() {
                updateConnectionStatus(true);
            };

            eventSource.onmessage = function(event) {
                removeTypingIndicator();
                try {
                    const data = JSON.parse(event.data);
                    if (data.content) {
                        addMessage('assistant', data.content);
                    }
                } catch (e) {
                    // 非JSON数据，直接显示
                    if (event.data && event.data !== 'ping') {
                        addMessage('assistant', event.data);
                    }
                }
            };

            eventSource.onerror = function(error) {
                updateConnectionStatus(false);
                // SSE连接断开是正常的，不需要显示错误
            };
        }

        // 按键处理
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            generateSessionId();
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
